name: CI

on:
  pull_request:
  push:
    branches: [main, "final-r0/**", "slice-01/application-core", "slice-02/training-journey-readiness"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saql
          POSTGRES_PASSWORD: saql
          POSTGRES_DB: saql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://saql:saql@localhost:5432/saql_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require lockfile
        run: test -f package-lock.json
      - run: npm run r0:env-check
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:assert-migration
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run ci
      - name: Verify Slice01 persisted data and canonical seed counts
        run: npm run test:slice01:db-evidence
      - name: Verify Slice02 journey links, correlated audit, retry and unchanged seed
        run: npm run test:slice02:db-evidence
      - name: Reject test actor in production runtime
        run: npm run test:production-actor-guard
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload G3 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice02-g3-test-evidence
          path: test-results/
          retention-days: 14
